aid: lalilo
name: Lalilo
description: 'Lalilo is an adaptive reading and literacy web application for primary-school
  classrooms, founded in Paris in 2016 and acquired by Renaissance (Wisconsin Rapids,
  USA) in 2021. It delivers roughly 90,000 interactive phonics, fluency and comprehension
  exercises that adapt in real time to each student, uses speech recognition to assess
  oral reading aloud, and gives teachers a dashboard for tracking progress and running
  differentiated small-group instruction. It is used by around 40,000 teachers and
  400,000 students a year in France across cycles 2 and 3, with explicit support for
  DYS, allophone, ULIS, SEGPA and IME learners. Lalilo publishes no public API, developer
  portal or API documentation: the product is consumed through the teacher and student
  web applications at app.lalilo.com, and integration or rostering questions are handled
  through Renaissance support rather than a self-serve developer program.'
